# Notes on the corpus that no generated file carries.
#
# A `recorded` grade means an upstream capture whose ids are unique across the
# corpus: a stream that reuses a capture's ids is maintainer-authored however it
# was obtained, and is graded `synthetic`.
#
# No source here publishes these, so nothing is vendored for them: the anthropic
# `error` event; the chat `{"error": …}` frame and the `content_filter` finish
# reason; a recorded or example instance of the responses `response.failed`,
# `response.error`, `response.incomplete`,
# `response.function_call_arguments.delta` and `.done` events — the last three are
# asserted against their extracted `required` lists instead, and the first two have
# no evidence of any grade.

